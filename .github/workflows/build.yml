name: build-apk
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.31.1"

      - name: Prepare SDK + keystore
        run: |
          sed -i 's|ROOT="$(cd "$(dirname "$0")/.." && pwd)"|ROOT="$(cd "$(dirname "$0")" \&\& pwd)"|' android_sdk.sh
          bash android_sdk.sh "$GITHUB_WORKSPACE/android/sdk/rexglue-sdk"
          keytool -genkeypair -keystore android/ci-release.jks -alias rexauto \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass rexauto -keypass rexauto -dname "CN=rexauto"
          chmod +x android/gradlew

      - name: Build Release
        run: |
          ./gradlew assembleRelease -PrexName=sonicgenerations \
            -PrexPortDir=$GITHUB_WORKSPACE/port \
            -PrexSdkDir=$GITHUB_WORKSPACE/android/sdk/rexglue-sdk
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: sonicgenerations-apk
          path: android/app/build/outputs/apk/release/*.apk