name: build-apk
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug = debuggable + simpleperf, faster)'
        required: true
        default: 'release'
        type: choice
        options: [release, debug]
  push: { branches: [main] }
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3

      - name: Install SDK packages
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.31.1"

      - name: Prepare SDK + keystore
        run: |
          sed -i 's|ROOT="$(cd "$(dirname "$0")/.." && pwd)"|ROOT="$(cd "$(dirname "$0")" \&\& pwd)"|' android_sdk.sh
          bash android_sdk.sh "$GITHUB_WORKSPACE/android/sdk/rexglue-sdk"
          keytool -genkeypair -keystore android/ci-release.jks -alias rexauto \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass rexauto -keypass rexauto -dname "CN=rexauto"
          chmod +x android/gradlew

      - name: Build
        env:
          # Huge native build (318 MB generated + thin-LTO link): cap ninja
          # parallelism so parallel -O3 TUs + lld don't OOM the 16 GB runner
          # (runner lost communication after ~58 min = classic OOM-kill).
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.workers.max=2"
        run: |
          BT="${{ inputs.build_type }}"
          [ -z "$BT" ] && BT="release"
          case "$BT" in
            debug) TASK=assembleDebug; DIR=debug;;
            *) TASK=assembleRelease; DIR=release;;
          esac
          echo "BT=$BT TASK=$TASK DIR=$DIR" >> $GITHUB_ENV
          ./gradlew $TASK -PrexName=sonicgenerations \
            -PrexPortDir=$GITHUB_WORKSPACE/port \
            -PrexSdkDir=$GITHUB_WORKSPACE/android/sdk/rexglue-sdk
          echo "--- APK outputs ---"
          find app/build/outputs/apk -type f | sort
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: sonicgenerations-apk-${{ env.BT }}
          path: android/app/build/outputs/apk/**/*.apk